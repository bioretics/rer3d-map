<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico">

    <title>rer3d-map - Piani Emergenza Comunali</title>

    <!-- Bootstrap core CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->

    <!-- Custom styles for this template -->
    <link href="css/custom.css" rel="stylesheet">

    <!-- Just for debugging purposes. Don't actually copy these 2 lines! -->

    <script src="../../assets/js/ie-emulation-modes-warning.js"></script>

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->


  </head>

  <body>

    <!-- Fixed navbar -->
    <nav class="navbar navbar-inverse navbar-fixed-top">
      <div class="container">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" target="_blank" href="https://www.regione.marche.it"><img src="../images/logo.png" alt="Regione Marche" style="width: auto" height="52" title="Regione Marche" /></a>
          <a class="navbar-brand" target="_blank" href="https://www.regione.marche.it/Regione-Utile/Protezione-Civile"><img src="../images/logo-marche-pc.png" alt="Protezione Civile Regione Marche" style="width: auto" height="32" title="Protezione Civile Regione Marche" /></a>
        </div>
      </div>
    </nav>

    <!-- Begin page content -->
    <div class="container content">
      <div class="row">
        <div class="col-md-12">
          <h1>Piani Emergenza Comunali</h1>
          <p>Elenco dei piani di protezione civile comunali della Regione Marche.</p>
          <p><em>List of municipal civil protection plans of the Marche Region.</em></p>

          <div class="form-group">
            <select id="province-filter" class="form-control" style="max-width:300px;">
              <option value="">Tutte le province / All provinces</option>
            </select>
          </div>

          <div id="loading-container" class="text-center text-muted" style="padding:40px 0;">
            Caricamento dati... / Loading data...
          </div>

          <div id="error-container" class="text-center text-danger" style="display:none; padding:40px 0;">
            Errore nel caricamento dei dati. / Error loading data.
          </div>

          <table id="plans-table" class="table table-striped table-hover" style="display: none;">
            <thead>
              <tr>
                <th></th>
                <th>Provincia</th>
                <th>Comune</th>
              </tr>
            </thead>
            <tbody id="plans-tbody">
            </tbody>
          </table>

        </div>
      </div>
    </div><!-- End container -->

    <footer class="footer">
      <div class="container">
        <p class="text-muted" style="color:#3B3B3B;">&copy; {copyright}</p>
      </div>
    </footer>


    <!-- Bootstrap core JavaScript -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script>window.jQuery || document.write('<script src="../../assets/js/vendor/jquery.min.js"><\/script>')</script>
    <script src="js/bootstrap.min.js"></script>
    <!-- IE10 viewport hack for Surface/desktop Windows 8 bug -->
    <script src="../../assets/js/ie10-viewport-bug-workaround.js"></script>

    <script>
      (function() {
        var loadingContainer = document.getElementById('loading-container');
        var errorContainer = document.getElementById('error-container');
        var plansTable = document.getElementById('plans-table');
        var plansTbody = document.getElementById('plans-tbody');
        var provinceFilter = document.getElementById('province-filter');

        var plansData = [];

        var WFS_CONFIG = {
          url: 'https://geosrv-protciv.regione.marche.it/geoserver/qmap_mzs_rm/ows',
          typeName: 'qmap_mzs_rm:qmp_mzs_stato_progetto_view',
          propertyNames: {
            province: 'prov',
            municipality: 'comune',
            planUrl: 'link_ppc_comune'
          }
        };

        var PDF_ICON_SVG = '<img src="img/pdf.svg" alt="PDF" width="24" height="24">';

        function buildWfsUrl() {
          if (!WFS_CONFIG.url || !WFS_CONFIG.typeName) {
            return null;
          }
          var params = new URLSearchParams({
            service: 'WFS',
            version: '1.0.0',
            request: 'GetFeature',
            typeName: WFS_CONFIG.typeName,
            outputFormat: 'application/json',
            propertyName: 'prov,comune,link_ppc_comune'
          });
          return WFS_CONFIG.url + '?' + params.toString();
        }

        function fetchData() {
          var wfsUrl = buildWfsUrl();

          if (!wfsUrl) {
            loadingContainer.innerHTML = '<p>I dati dei piani saranno disponibili quando il servizio WFS sarà configurato.</p><p><em>Plan data will be available when the WFS service is configured.</em></p>';
            return;
          }

          fetch(wfsUrl)
            .then(function(response) {
              if (!response.ok) {
                throw new Error('Network response was not ok');
              }
              return response.json();
            })
            .then(function(data) {
              plansData = parseWfsData(data);
              populateProvinceFilter();
              renderTable(plansData);
              loadingContainer.style.display = 'none';
              plansTable.style.display = 'table';
            })
            .catch(function(error) {
              console.error('Error fetching WFS data:', error);
              loadingContainer.style.display = 'none';
              errorContainer.style.display = 'block';
            });
        }

        function parseWfsData(data) {
          var features = data.features || [];
          return features.map(function(feature) {
            var props = feature.properties || {};
            return {
              province: props[WFS_CONFIG.propertyNames.province] || '',
              municipality: props[WFS_CONFIG.propertyNames.municipality] || '',
              planUrl: props[WFS_CONFIG.propertyNames.planUrl] || ''
            };
          }).filter(function(item) {
            return item.planUrl && item.planUrl.trim() !== '';
          }).sort(function(a, b) {
            var provCompare = a.province.localeCompare(b.province);
            if (provCompare !== 0) return provCompare;
            return a.municipality.localeCompare(b.municipality);
          });
        }

        function populateProvinceFilter() {
          var provinces = [];
          plansData.forEach(function(item) {
            if (item.province && provinces.indexOf(item.province) === -1) {
              provinces.push(item.province);
            }
          });
          provinces.sort();

          provinces.forEach(function(province) {
            var option = document.createElement('option');
            option.value = province;
            option.textContent = province;
            provinceFilter.appendChild(option);
          });
        }

        function renderTable(data) {
          plansTbody.innerHTML = '';

          if (data.length === 0) {
            var row = document.createElement('tr');
            row.innerHTML = '<td colspan="3" style="text-align: center; color: #999;">Nessun dato disponibile / No data available</td>';
            plansTbody.appendChild(row);
            return;
          }

          data.forEach(function(item) {
            var row = document.createElement('tr');

            var iconCell = document.createElement('td');
            if (item.planUrl) {
              var link = document.createElement('a');
              link.href = item.planUrl;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              link.title = 'Apri piano di ' + item.municipality;
              link.innerHTML = PDF_ICON_SVG;
              iconCell.appendChild(link);
            }

            var provinceCell = document.createElement('td');
            provinceCell.textContent = item.province || '-';

            var municipalityCell = document.createElement('td');
            municipalityCell.textContent = item.municipality || '-';

            row.appendChild(iconCell);
            row.appendChild(provinceCell);
            row.appendChild(municipalityCell);
            plansTbody.appendChild(row);
          });
        }

        provinceFilter.addEventListener('change', function() {
          var selectedProvince = this.value;
          var filteredData = selectedProvince
            ? plansData.filter(function(item) { return item.province === selectedProvince; })
            : plansData;
          renderTable(filteredData);
        });

        fetchData();
      })();
    </script>
  </body>
</html>
